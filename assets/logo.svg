<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="SRF Corporation logo mark">
  <!-- SRF Corporation — angular S-bolt monogram in a hexagon.
       Two-tone blues matching the original wordmark: #1565D8 -> #2196F3 -> #38BDF8 -->
  <defs>
    <linearGradient id="srfHex" x1="14" y1="7" x2="106" y2="113" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1565D8"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="srfBolt" x1="106" y1="10" x2="14" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2196F3"/>
      <stop offset="1" stop-color="#1565D8"/>
    </linearGradient>
  </defs>
  <!-- outer hexagon -->
  <path d="M60 7 106 33.5v53L60 113 14 86.5v-53L60 7Z" stroke="url(#srfHex)" stroke-width="6.5" stroke-linejoin="round"/>
  <!-- inner echo hexagon -->
  <path d="M60 26 91 43.8v32.4L60 94 29 76.2V43.8L60 26Z" stroke="url(#srfHex)" stroke-width="1.75" opacity=".38"/>
  <!-- angular S bolt, 45-degree geometry -->
  <path d="M84 36H36l48 48H36" stroke="url(#srfBolt)" stroke-width="13"/>
</svg>
